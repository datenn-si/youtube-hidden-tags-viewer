name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm fmt:check

      - name: TypeScript Check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: youtube-hidden-tags.user.js
          path: dist/youtube-hidden-tags.user.js
